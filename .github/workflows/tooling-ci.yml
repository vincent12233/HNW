name: Tooling CI

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'apps/client/lib/pages/**'
      - 'apps/client/lib/services/**'
      - 'apps/api/src/**'
      - 'apps/admin/**'
      - '.github/workflows/tooling-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'apps/client/lib/pages/**'
      - 'apps/client/lib/services/**'
      - 'apps/api/src/**'
      - 'apps/admin/**'
      - '.github/workflows/tooling-ci.yml'

permissions:
  contents: read

concurrency:
  group: tooling-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-setup-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce maintainable source file sizes
        shell: bash
        run: node ./scripts/check-source-file-size.mjs
      - name: Enforce Flutter architecture rules
        shell: bash
        run: node ./scripts/check-flutter-architecture.mjs
      - name: Check Android setup failure handling on Windows PowerShell
        shell: powershell
        run: ./scripts/tests/android-e2e.test.ps1
      - name: Check verification restores the caller environment
        shell: powershell
        run: ./scripts/tests/verify-environment.test.ps1
