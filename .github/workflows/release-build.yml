name: Build Immutable API Release
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: ghcr.io/vincent12233/hnw-api:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.built_at }}
      - name: Record immutable OCI index, platform and config mapping
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/create-build-record.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: api-build-record
          path: build-record/build.json
          retention-days: 90
