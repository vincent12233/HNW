name: Flutter Integration Tests

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Simulator-reachable API base URL
        required: false
        default: 'https://api.example.test'
        type: string
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - '.github/workflows/flutter-integration.yml'
  pull_request:
    paths:
      - 'apps/client/**'
      - '.github/workflows/flutter-integration.yml'

permissions:
  contents: read

concurrency:
  group: flutter-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-integration:
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Synchronize CocoaPods sandbox
        working-directory: apps/client/ios
        run: pod install --repo-update

      - name: Boot iOS simulator and run integration tests
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://api.example.test' }}
        run: |
          set -euo pipefail
          run_with_timeout() {
            local limit_seconds="$1"
            shift
            "$@" &
            local pid=$!
            for ((elapsed=0; elapsed<limit_seconds; elapsed++)); do
              if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; return $?; fi
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
            return 124
          }
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')"
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl boot "$DEVICE_ID" || true
          run_with_timeout 720 xcrun simctl bootstatus "$DEVICE_ID" -b
          run_with_timeout 1800 flutter test integration_test/critical_flows_test.dart -d "$DEVICE_ID" --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-integration-artifacts
          path: |
            apps/client/test_driver
            apps/client/build
          if-no-files-found: ignore
