name: API CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Placeholder URLs for prisma.config.ts / postinstall generate (no DB service).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_ci_shadow

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint API
        run: npm run lint

      - name: Build API
        run: npm run build

      - name: Assert production entrypoint
        run: |
          test -f dist/main.js
          test ! -e dist/src/main.js

      - name: Run unit tests
        run: npm test -- --runInBand
