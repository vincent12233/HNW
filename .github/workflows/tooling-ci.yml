name: Tooling CI

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'apps/api/scripts/**'
      - '.github/workflows/tooling-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'apps/api/scripts/**'
      - '.github/workflows/tooling-ci.yml'

permissions:
  contents: read

jobs:
  android-setup-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Android setup failure handling on Windows PowerShell
        shell: powershell
        run: ./scripts/tests/android-e2e.test.ps1
      - name: Check verification restores the caller environment
        shell: powershell
        run: ./scripts/tests/verify-environment.test.ps1
      - name: Check funding integration runner URL guard on Windows PowerShell
        shell: powershell
        run: ./scripts/tests/funding-integration-runner.test.ps1
