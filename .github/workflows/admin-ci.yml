name: Admin CI

# Deposits are submitted through online customer service and credited by finance after verification.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://127.0.0.1:3000

      - name: Install Chromium for rendered visual checks
        run: npx playwright install --with-deps chromium

      - name: Capture rendered Admin visual evidence
        run: npm run test:visual
        env:
          NEXT_PUBLIC_API_URL: https://127.0.0.1:3000

      - name: Upload Admin visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-visual-evidence-${{ github.sha }}
          path: apps/admin/test-results/visual
          if-no-files-found: error
          retention-days: 30
