services:
  postgres:
    image: postgres:17-alpine
    container_name: hnw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hnw_user
      POSTGRES_PASSWORD: hnw_dev_password
      POSTGRES_DB: hnw_trading
    ports:
      - "5432:5432"
    volumes:
      - hnw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnw_user -d hnw_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hnw_postgres_data: