name: Admin CI

# Deposits are submitted through online customer service and credited by finance after verification.

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - '.nvmrc'
      - '.github/workflows/admin-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - '.nvmrc'
      - '.github/workflows/admin-ci.yml'

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://127.0.0.1:3000
