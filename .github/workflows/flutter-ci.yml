name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce Flutter architecture rules
        working-directory: .
        run: node ./scripts/check-flutter-architecture.mjs

      - name: Enforce client screen inventory
        working-directory: .
        run: node ./scripts/check-client-screen-inventory.mjs

      - name: Enforce customer information boundary
        working-directory: .
        run: node ./scripts/check-client-information-boundary.mjs

      - name: Verify protected customer and trading flows
        working-directory: .
        run: bash ./scripts/verify-protected-flows.sh --flutter-only

      - name: Analyze
        # Errors and warnings block; infos stay non-fatal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Capture responsive visual evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-visual-evidence"
          flutter test test/ui_capture_test.dart --update-goldens --dart-define=UI_CAPTURE_DIR="$RUNNER_TEMP/flutter-visual-evidence"
          flutter test test/enterprise_visual_states_test.dart --update-goldens --dart-define=UI_CAPTURE_DIR="$RUNNER_TEMP/flutter-visual-evidence"

      - name: Upload Flutter visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-visual-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-visual-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: apps/client/coverage/lcov.info
          if-no-files-found: error
