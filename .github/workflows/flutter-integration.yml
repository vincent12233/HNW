name: Flutter Integration Tests

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public or emulator-reachable API base URL
        required: true
        type: string
  pull_request:
    paths:
      - 'apps/client/**'
      - '.github/workflows/flutter-integration.yml'

permissions:
  contents: read

concurrency:
  group: flutter-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://10.0.2.2:3100' }}

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-integration-artifacts
          path: |
            apps/client/test_driver
            apps/client/build
          if-no-files-found: ignore