name: Admin CI

# Deposits are submitted through online customer service and credited by finance after verification.

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://127.0.0.1:3000
