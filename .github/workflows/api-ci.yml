name: API CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_ci_shadow?schema=public
      JWT_SECRET: ci-jwt-secret-32-characters-abcdef123456
      OTC_KEY_ENCRYPTION_SECRET: ci-otc-secret-32-characters-abcdef123456
      OBJECT_SIGNING_SECRET: ci-object-secret-32-characters-abcdef123456
      TWO_FACTOR_ENCRYPTION_KEY: ci-2fa-secret-32-characters-abcdef123456
      HNW_VERIFY_PG: '1'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d trading_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Lint API
        run: npm run lint

      - name: Build API
        run: npm run build

      - name: Assert production entrypoint
        run: |
          test -f dist/main.js
          test ! -e dist/src/main.js

      - name: Run unit tests
        run: npm test -- --runInBand
