version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest-ecosystem:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
    ignore:
      # Nest CLI / ts-jest / typescript-eslint still need the TS<=6 compiler API
      # (TypeScript 7 removed the programmatic API until ~7.1).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Stay on Prisma 7 until 8 is GA (currently RC / rewrite).
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the Node 24 line (runtime/Docker/CI are 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
      antd:
        patterns:
          - 'antd'
          - '@ant-design/*'
    ignore:
      # Next/admin stay on TS 6 until Nest/Next ecosystem ships TS 7 API support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /apps/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Stay on Node 24 LTS (not Current 26)
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Stay on nginx 1.30 stable (skip 1.31+ mainline)
      - dependency-name: nginx
        versions: [">=1.31.0"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Stay on Postgres 17 with the app; skip 18+ majors for now.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
