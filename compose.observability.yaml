name: hnw-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [hnw-local]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${HNW_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${HNW_GRAFANA_ADMIN_PASSWORD:?Set HNW_GRAFANA_ADMIN_PASSWORD before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/hnw.yml:ro
      - ./docker/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/hnw.yml:ro
      - ./docker/observability/hnw-api-dashboard.json:/var/lib/grafana/dashboards/hnw-api-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    networks: [hnw-local]
    depends_on: [prometheus]
    restart: unless-stopped
networks:
  hnw-local:
    name: hnw-local-e2e_default
    external: true
volumes:
  prometheus-data:
  grafana-data:
