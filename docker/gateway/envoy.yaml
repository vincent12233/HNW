static_resources:
  listeners:
    - name: public_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8088 }
      per_connection_buffer_limit_bytes: 1048576
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: hnw_gateway
                use_remote_address: true
                xff_num_trusted_hops: 0
                stream_idle_timeout: 65s
                request_timeout: 30s
                common_http_protocol_options:
                  idle_timeout: 65s
                  headers_with_underscores_action: REJECT_REQUEST
                route_config:
                  name: hnw_routes
                  request_headers_to_remove: ["x-forwarded-for", "x-forwarded-proto", "x-real-ip"]
                  virtual_hosts:
                    - name: hnw
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/api/" }
                          route: { cluster: api, prefix_rewrite: "/", timeout: 30s }
                        - match: { prefix: "/socket.io/" }
                          route: { cluster: api, timeout: 0s, upgrade_configs: [{ upgrade_type: websocket }] }
                        - match: { prefix: "/ws/" }
                          route: { cluster: api, prefix_rewrite: "/", timeout: 0s, upgrade_configs: [{ upgrade_type: websocket }] }
                        - match: { prefix: "/" }
                          route: { cluster: client_web, timeout: 30s }
                http_filters:
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 1048576
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: api
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: api
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: api, port_value: 3100 } } } }] }]
    - name: client_web
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: client_web
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: client-web, port_value: 8080 } } } }] }]
admin:
  access_log_path: /tmp/envoy-admin.log
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
