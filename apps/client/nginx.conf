server {
  listen 80;
  server_name _;
  # The API is addressed through the Compose network below; the browser only
  # sees this client origin.
  resolver 127.0.0.11 valid=30s;
  root /usr/share/nginx/html;
  index index.html;

  # Flutter keeps stable filenames such as main.dart.js. These entry files
  # must be revalidated after every container rebuild.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Keep the browser on the client origin. Compose service discovery routes
  # requests directly to the API container, so registration and authenticated
  # calls remain stable across host platforms and container restarts.
  location /api/ {
    set $api_upstream api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  location ~* ^/(?:main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location ~* \.(?:png|jpg|jpeg|webp|heic|heif|svg|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
