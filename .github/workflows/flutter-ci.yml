name: Flutter CI

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - 'scripts/check-flutter-architecture.mjs'
      - 'scripts/flutter-architecture-baseline.json'
      - 'scripts/check-client-screen-inventory.mjs'
      - 'scripts/client-screen-inventory.json'
      - 'scripts/check-client-information-boundary.mjs'
      - 'AGENTS.md'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/client/**'
      - 'scripts/check-flutter-architecture.mjs'
      - 'scripts/flutter-architecture-baseline.json'
      - 'scripts/check-client-screen-inventory.mjs'
      - 'scripts/client-screen-inventory.json'
      - 'scripts/check-client-information-boundary.mjs'
      - 'AGENTS.md'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce Flutter architecture rules
        working-directory: .
        run: node ./scripts/check-flutter-architecture.mjs

      - name: Enforce client screen inventory
        working-directory: .
        run: node ./scripts/check-client-screen-inventory.mjs

      - name: Enforce customer information boundary
        working-directory: .
        run: node ./scripts/check-client-information-boundary.mjs

      - name: Verify protected customer and trading flows
        working-directory: .
        run: bash ./scripts/verify-protected-flows.sh --flutter-only

      - name: Analyze
        # Errors and warnings block; infos stay non-fatal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: apps/client/coverage/lcov.info
          if-no-files-found: error
